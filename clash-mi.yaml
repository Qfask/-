port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info

proxy-providers:
  airport:
    type: http
    url: https://raw.githubusercontent.com/Qfask/-/refs/heads/main/%E9%A1%B6%E7%BA%A7%E6%9C%BA%E5%9C%BA.txt
    interval: 3600
    path: ./providers/airport.yaml

proxy-groups:
  - name: 🚀 节点选择
    type: select
    use:
      - airport

  - name: ♻️ 自动选择
    type: url-test
    use:
      - airport
    url: http://www.gstatic.com/generate_204
    interval: 300

rules:
  - MATCH,🚀 节点选择
